name: Deploy - Produção Railway / Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build e Deploy em Produção
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Instalar dependências de build
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Executar Migrações no Banco de Produção
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate:prod

      - name: Build Next.js Standalone
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: npm run build

      - name: Disparar Deploy no Railway (via CLI/Webhook)
        if: env.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up --service unicria-ana --detach

